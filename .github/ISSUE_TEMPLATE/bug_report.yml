name: Bug report
description: Report reproducible incorrect behavior in MARGINAL
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not report security vulnerabilities here; follow SECURITY.md."
  - type: input
    id: version
    attributes:
      label: MARGINAL version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and platform
      placeholder: "Python 3.13 on Windows 11"
    validations:
      required: true
  - type: input
    id: mode
    attributes:
      label: Execution mode and policy/estimator identity
      placeholder: "shadow; profile:quality-first@2.0.0; historical-mean@2.0.0"
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include reason codes and the smallest reproducible example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: Redacted trace or Decision Ledger records
      description: Remove prompts, credentials, personal data, and proprietary content.
